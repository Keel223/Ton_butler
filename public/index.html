<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TON Butler</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
</head>
<body>
    <div id="app">
        <div id="header">
            <div>⚔️ <span id="damage-display">1</span> | 🔥 <span id="rate-display">500</span>ms</div>
            <div>✨ <span id="exp-display">0</span></div>
            <div>💎 <span id="ton-display">0.00</span></div>
        </div>
        
        <!-- Кнопка TON Connect -->
        <div id="ton-connect-container"></div>

        <nav id="menu">
            <button class="tab-btn active" onclick="switchTab('game')">Игра</button>
            <button class="tab-btn" onclick="switchTab('upgrade')">Улучшения</button>
            <button class="tab-btn" onclick="switchTab('market')">P2P Рынок</button>
        </nav>

        <div id="tab-game" class="tab-content active">
            <canvas id="gameCanvas" width="350" height="400"></canvas>
        </div>

        <div id="tab-upgrade" class="tab-content">
            <div class="upgrade-card">
                <h3>Урон Батлера</h3>
                <p>Убивай монстров быстрее!</p>
                <button onclick="upgradeStat('damage')">Прокачать (100 EXP)</button>
            </div>
            <div class="upgrade-card">
                <h3>Скорострельность</h3>
                <p>Стреляй чаще (-50мс)</p>
                <button onclick="upgradeStat('fireRate')">Прокачать (150 EXP)</button>
            </div>
        </div>

        <div id="tab-market" class="tab-content">
            <button id="create-listing-btn" onclick="openListingModal()">Продать EXP</button>
            <button id="withdraw-btn" onclick="withdrawTon()">Вывести TON</button>
            <h3>Лоты на продаже:</h3>
            <div id="market-listings"></div>
        </div>
    </div>

    <div id="listing-modal" class="modal" style="display:none;">
        <div class="modal-content">
            <h3>Выставить EXP на продажу</h3>
            <input type="number" id="list-exp-amount" placeholder="Сколько EXP продать?">
            <input type="number" id="list-ton-price" placeholder="Цена в TON (напр. 0.5)" step="0.01">
            <button onclick="createListing()">Выставить на рынок</button>
            <button onclick="closeListingModal()">Отмена</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
